<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IBKR Trading POC</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px}
    .card{border:1px solid #ddd;border-radius:12px;padding:24px;margin-top:20px}
    button{padding:10px 16px;border-radius:8px;border:1px solid #888;background:#fff;cursor:pointer}
    #status{margin-top:16px;font-family:monospace;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>IBKR Trading POC</h1>
  <p>Connectivity test only. No orders are submitted by this version.</p>
  <div class="card">
    <button id="test">Test IBKR Connection</button>
    <div id="status">NOT TESTED</div>
  </div>
  <script>
    document.getElementById('test').onclick = async () => {
      const status = document.getElementById('status');
      status.textContent = 'Testing...';
      try {
        const r = await fetch('/api/ibkr-test');
        const data = await r.json();
        status.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        status.textContent = 'ERROR: ' + e.message;
      }
    };
  </script>
</body>
</html>
